# Ambiente local reproduzível da nova loja Casa das Fardas (WordPress + WooCommerce).
# Não usar em produção sem rever credenciais, volumes, SMTP e cópias de segurança.
name: casadasfardas

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-cdf-local}
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-staging}
  CDF_SMTP_HOST: ${CDF_SMTP_HOST:-mailpit}
  CDF_SMTP_PORT: ${CDF_SMTP_PORT:-1025}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', getenv_docker( 'WP_ENVIRONMENT_TYPE', 'staging' ) );
    define( 'DISALLOW_FILE_EDIT', true );
    define( 'WP_POST_REVISIONS', 20 );
    define( 'WP_DEBUG_LOG', '/tmp/wp-debug.log' );
    // Pedidos de orçamento e anexos ficam fora da raiz pública.
    define( 'CDF_PRIVATE_DIR', '/var/www/cdf-private' );
    define( 'CDF_IMPORT_DIR', '/var/www/cdf-import' );

x-wp-volumes: &wp-volumes
  - wp:/var/www/html
  - private:/var/www/cdf-private
  - ./wp-content/themes/casadasfardas:/var/www/html/wp-content/themes/casadasfardas
  - ./wp-content/plugins/cdf-core:/var/www/html/wp-content/plugins/cdf-core
  - ./catalog:/var/www/cdf-import/catalog:ro
  - ./audit/media:/var/www/cdf-import/media:ro
  - ./config/php.ini:/usr/local/etc/php/conf.d/casadasfardas.ini:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-cdf-local}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8092}:80"
    environment:
      <<: *wp-env
    volumes: *wp-volumes

  # Captura todo o email gerado localmente; nada sai para a Internet.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8028}:8025"

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp:/var/www/html
      - private:/var/www/cdf-private
      - ./wp-content/themes/casadasfardas:/var/www/html/wp-content/themes/casadasfardas
      - ./wp-content/plugins/cdf-core:/var/www/html/wp-content/plugins/cdf-core
      - ./catalog:/var/www/cdf-import/catalog:ro
      - ./audit/media:/var/www/cdf-import/media:ro
      - ./exports:/exports
      - ./docs:/docs

volumes:
  db:
  wp:
  private:
